queue_rules:
  - name: default
    queue_conditions: []

pull_request_rules:
  - name: VM1_MIN2_REQUIRED_REVIEWER_PARITY
    conditions:
      - title = VM1_MIN2_REQUIRED_REVIEWER_PARITY
      - label = vm1-min2-review-trigger
    actions:
      merge:
        method: squash

merge_protections:
  - name: VM1 files hard-cap security guard
    description: "Controlled test: any zzzz-auth/ file must carry security-reviewed."
    if:
      - files ~= ^zzzz-auth/
    success_conditions:
      - label = security-reviewed
