defaults:
  actions:
    comment:
      bot_account: livastic-vm1-primary
pull_request_rules:
  - name: vm1 default bot inherit control
    conditions:
      - title = VM1_DEFAULT_BOT_INHERIT_CONTROL
    actions:
      comment:
        message: VM1_DEFAULT_BOT_INHERIT_CONTROL_COMMENT
  - name: vm1 explicit null bot override
    conditions:
      - title = VM1_DEFAULT_BOT_NULL_OVERRIDE
    actions:
      comment:
        bot_account: null
        message: VM1_DEFAULT_BOT_NULL_OVERRIDE_COMMENT
