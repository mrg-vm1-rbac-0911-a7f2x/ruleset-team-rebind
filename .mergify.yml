commands_restrictions:
  queue:
    conditions:
      - sender = livastic-vm1-primary
merge_queue:
  queue_controls_comment: false
queue_rules:
  - name: vm1 generated checked marker queue sink
    branch_protection_injection_mode: merge
    queue_conditions:
      - title = VM1_GENERATED_QUEUE_CONTROL_CREATED
    merge_conditions:
      - label = vm1-never-generated-marker-merge
pull_request_rules:
  - name: vm1 reflect body as Mergify comment
    conditions:
      - title = VM1_GENERATED_QUEUE_CONTROL_CREATED
    actions:
      comment:
        message: '{{ body }}'
