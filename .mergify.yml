defaults:
  queue_rule:
    branch_protection_injection_mode: none
    batch_size: 1
    batch_max_wait_time: 1 sec
    max_checks_retries: 1
    draft_bot_account: livastic-vm1-primary
    merge_bot_account: livastic-vm1-primary
queue_rules:
  - name: vm1 queue default draft inherit
    queue_conditions:
      - title = VM1_QUEUE_DEFAULT_DRAFT_INHERIT
    merge_conditions:
      - check-success = vm1-never-draft
  - name: vm1 queue explicit null draft override
    draft_bot_account: null
    queue_conditions:
      - title = VM1_QUEUE_DEFAULT_DRAFT_NULL
    merge_conditions:
      - check-success = vm1-never-draft
