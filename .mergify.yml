merge_queue:
  queue_controls_comment: false
queue_rules:
  - name: vm1 synthetic draft workflow isolation
    batch_size: 1
    batch_max_wait_time: 1 sec
    max_checks_retries: 1
    queue_conditions:
      - title = VM1_SYNTHETIC_DRAFT_QUEUE_SOURCE
    merge_conditions:
      - check-success = vm1-never-synthetic-draft-merge
pull_request_rules:
  - name: vm1 draft workflow positive-control-and-isolation
    conditions:
      - draft
    actions:
      comment:
        message: VM1_SYNTHETIC_DRAFT_WORKFLOW_RULE_FIRED
